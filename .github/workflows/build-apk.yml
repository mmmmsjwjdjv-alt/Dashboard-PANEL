name: Build MAXO Dashboard APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Prepare APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./MAXO-Dashboard.apk
          ls -la MAXO-Dashboard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXO-Dashboard-APK
          path: ./MAXO-Dashboard.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes || true
          git tag -f v1.0 || true
          git push -f origin v1.0 || true
          gh release create v1.0 ./MAXO-Dashboard.apk \
            --title "MAXO Dashboard v1.0 (Direct APK)" \
            --notes "Direct installable APK for Android. Download MAXO-Dashboard.apk below directly without needing to extract any zip." || true
